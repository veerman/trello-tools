<!-- The Trello Tools icon: the Markdown outline of a board (board, list, card). icon.png is this at 144 x 144. -->
<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144">
<rect width="144" height="144" rx="30" fill="#111827"/>
<g font-family="Consolas, 'Courier New', monospace" font-weight="700" fill="#2DD4BF">
<text x="20" y="50" font-size="30">#</text><text x="34" y="84" font-size="24">##</text><text x="48" y="116" font-size="20">###</text></g>
<rect x="46" y="32" width="78" height="14" rx="7" fill="#F9FAFB"/>
<rect x="70" y="68" width="54" height="12" rx="6" fill="#F9FAFB" fill-opacity=".85"/>
<rect x="92" y="101" width="32" height="10" rx="5" fill="#F9FAFB" fill-opacity=".7"/></svg>
